[workspace]
authors = ["MCHU-1999 <jerry.ee06@nctu.edu.tw>"]
channels = ["conda-forge"]
name = "cj-data-explorer"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
configure = { cmd = "cmake -S plane-detect -B plane-detect/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_EXPORT_COMPILE_COMMANDS=ON" }
build     = { cmd = "cmake --build plane-detect/build", depends-on = ["configure"] }
detect    = { cmd = "./plane-detect/build/plane_detect", depends-on = ["build"] }

[dependencies]
cmake = ">=4.5.0,<5"
ninja = ">=1.13.2,<2"
cxx-compiler = ">=2.0.0,<3"
cgal-cpp = ">=6.2.1,<7"
python = "3.13.18.*"
eigen = ">=5.0.1,<6"
tbb-devel = ">=2023.1.0,<2024"

[pypi-dependencies]
numpy = ">=2.5.5, <3"
rasterio = ">=1.5.2, <2"
pyrender = ">=0.1.45, <0.2"
gdal = ">=3.13.3, <4"
scipy = ">=1.18.1, <2"
